<ion-header class="ion-no-border"><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/home"></ion-back-button></ion-buttons><ion-title>Scan QR</ion-title></ion-toolbar></ion-header>
<ion-content><main class="page-shell narrow scan-shell"><section class="page-intro"><span>CAMERA</span><h1>Scan a QRSecure code.</h1><p>Camera permission is used only while scanning.</p></section><div class="scanner-card"><div class="scan-frame"><ion-icon name="qr-code-outline"></ion-icon><i></i></div><h2>Ready to scan</h2><p>The native scanner provides flashlight and camera controls when supported by your phone.</p><ion-button expand="block" size="large" [disabled]="busy" (click)="scan()"><ion-icon slot="start" name="camera-outline"></ion-icon>{{ busy ? 'Opening camera…' : 'Open Camera Scanner' }}</ion-button><ion-button fill="clear" routerLink="/home">Cancel</ion-button></div>@if (error) { <ion-note color="danger" class="notice">{{ error }}</ion-note> }</main></ion-content>
