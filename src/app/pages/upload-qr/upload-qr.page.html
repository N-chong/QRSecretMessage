<ion-header class="ion-no-border"><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/home"></ion-back-button></ion-buttons><ion-title>Upload QR</ion-title></ion-toolbar></ion-header>
<ion-content><main class="page-shell narrow"><section class="page-intro"><span>GALLERY</span><h1>Open a QR image.</h1><p>Select a screenshot or saved QRSecure image from this device.</p></section><div class="upload-card"><label class="drop-zone"><input type="file" accept="image/*" (change)="choose($event)">@if (preview) { <img [src]="preview" alt="Selected QR preview"> } @else { <ion-icon name="image-outline"></ion-icon><strong>Select QR Image</strong><small>PNG, JPG, or other supported image</small> }</label><ion-button expand="block" size="large" [disabled]="!file || busy" (click)="decode()"><ion-icon slot="start" name="cloud-upload-outline"></ion-icon>{{ busy ? 'Decoding…' : 'Decode QR' }}</ion-button></div>@if (valid) { <ion-note color="success" class="notice"><ion-icon name="checkmark-circle-outline"></ion-icon> Valid QRSecure message</ion-note> } @if (error) { <ion-note color="danger" class="notice">{{ error }}</ion-note> }</main></ion-content>
